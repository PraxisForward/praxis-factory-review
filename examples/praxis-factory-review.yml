name: Praxis Factory Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: praxis-factory-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Praxis Factory Review
    # Fork pull requests get no secrets. Do not switch to pull_request_target:
    # it hands secrets to a run that reads untrusted code.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: PraxisForward/praxis-factory-review@v0.1.0
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
